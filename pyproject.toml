[project]
name = "yunta"
version = "0.2.2"
description = "Harness de agente de código para terminal, agnóstico al proveedor del modelo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["litellm>=1.40.0"]

[project.scripts]
yunta = "yunta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yunta*"]
