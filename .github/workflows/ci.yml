name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: pip install -e .[dev]
      - name: Compilación
        run: python -m py_compile main.py $(find yunta -name "*.py") $(find tests -name "*.py")
      - name: Tests
        run: python -m pytest tests/ -q
        env:
          # La suite no requiere credenciales: litellm se intercepta en tests.
          LLM_MODEL: ci-placeholder
